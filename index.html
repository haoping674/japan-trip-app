<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f8177" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="關西旅遊" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>關西旅遊小工具</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2320201e'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ba3d2c'/%3E%3C/svg%3E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=26" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="trip-title">
        <div class="hero__grain"></div>
        <div class="hero__content">
          <p class="kicker"><i data-lucide="map-pinned" aria-hidden="true"></i> My travel journal</p>
          <h1 id="trip-title">關西自駕版</h1>
          <p class="hero__dates">2026.09.06 - 09.16 · 京都 / 若狹 / 天橋立 / 大阪</p>
          <div class="hero__chips" aria-label="旅程摘要">
            <span><i data-lucide="calendar-days" aria-hidden="true"></i> 11 天</span>
            <span><i data-lucide="car-front" aria-hidden="true"></i> D3–D5 自駕</span>
            <span><i data-lucide="cloud-sun" aria-hidden="true"></i> 即時天氣</span>
          </div>
        </div>
      </section>

      <aside class="status-banner" id="network-status" aria-live="polite">
        <i data-lucide="wifi"></i>
        <span>線上模式，天氣與導航可即時更新。</span>
      </aside>

      <aside class="update-notice" id="update-notice" aria-label="應用程式更新" aria-live="polite" hidden>
        <i data-lucide="sparkles" aria-hidden="true"></i>
        <div class="update-notice__copy">
          <strong>有新的旅程內容</strong>
          <span>完成目前操作後，更新即可取得最新版本。</span>
        </div>
        <button class="mini-button" id="update-now" type="button">立即更新</button>
        <button class="icon-button update-notice__dismiss" id="update-dismiss" type="button" aria-label="稍後更新" title="稍後更新"><i data-lucide="x"></i></button>
      </aside>

      <nav class="top-tabs" aria-label="主要分頁">
        <button class="tab-button is-active" data-tab="itinerary" type="button">
          <i data-lucide="map"></i>
          <span>行程</span>
        </button>
        <button class="tab-button" data-tab="guide" type="button">
          <i data-lucide="sparkles"></i>
          <span>導遊</span>
        </button>
        <button class="tab-button" data-tab="tools" type="button">
          <i data-lucide="briefcase"></i>
          <span>工具</span>
        </button>
      </nav>

      <section class="tab-panel is-active" id="itinerary" aria-label="每日行程">
        <button class="itinerary-mode-toggle" id="itinerary-mode-toggle" type="button" aria-pressed="false" aria-label="切換雨天備案" title="切換雨天備案">
          <i data-lucide="umbrella"></i>
        </button>
        <div class="day-strip" id="day-strip"></div>
        <div id="days"></div>
      </section>

      <section class="tab-panel" id="guide" aria-label="導遊筆記">
        <div class="section-heading">
          <p class="kicker">Personal Tour Guide</p>
          <h2>到這裡，該看什麼？</h2>
        </div>
        <div class="guide-grid" id="guide-grid"></div>
      </section>

      <section class="tab-panel" id="tools" aria-label="旅行工具">
        <div class="section-heading">
          <p class="kicker">Travel Desk</p>
          <h2>航班、住宿、緊急電話、記帳</h2>
        </div>
        <div class="tool-stack" id="tool-stack"></div>
      </section>

      <nav class="bottom-navigation" aria-label="手機主要導覽">
        <button class="bottom-nav-button is-active" data-tab="itinerary" type="button">
          <i data-lucide="calendar-days"></i><span>行程</span>
        </button>
        <button class="bottom-nav-button" data-tab="tools" data-focus="#booking" type="button">
          <i data-lucide="ticket-check"></i><span>預訂</span>
        </button>
        <button class="bottom-nav-button" data-tab="tools" data-focus="#expense" type="button">
          <i data-lucide="wallet-cards"></i><span>記帳</span>
        </button>
        <button class="bottom-nav-button" data-tab="tools" data-focus="#journal" type="button">
          <i data-lucide="notebook-pen"></i><span>日誌</span>
        </button>
        <button class="bottom-nav-button" data-tab="tools" data-focus="#preparation" type="button">
          <i data-lucide="luggage"></i><span>準備</span>
        </button>
        <button class="bottom-nav-button" data-tab="guide" type="button">
          <i data-lucide="sparkles"></i><span>導遊</span>
        </button>
      </nav>
    </main>

    <section class="today-mode" id="today-panel" aria-label="今日旅行模式" aria-live="polite"></section>
    <div class="sheet-backdrop" id="guide-backdrop" hidden></div>
    <section class="guide-sheet" id="guide-sheet" aria-label="詳細導遊內容" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="guide-sheet__header">
        <div>
          <p class="kicker" id="guide-sheet-kicker">Guide Detail</p>
          <h2 id="guide-sheet-title">導遊內容</h2>
        </div>
        <button class="icon-button" id="guide-sheet-close" type="button" aria-label="關閉導遊內容">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="guide-sheet__body" id="guide-sheet-body"></div>
    </section>
    <div class="sheet-backdrop" id="budget-backdrop" hidden></div>
    <section class="budget-sheet" id="budget-sheet" aria-label="消費詳情" aria-modal="true" role="dialog" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="guide-sheet__header">
        <div>
          <p class="kicker">Expense details</p>
          <h2>消費詳情</h2>
        </div>
        <button class="icon-button" id="budget-sheet-close" type="button" aria-label="關閉消費詳情">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="guide-sheet__body" id="budget-sheet-body"></div>
    </section>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js?v=26"></script>
  </body>
</html>
